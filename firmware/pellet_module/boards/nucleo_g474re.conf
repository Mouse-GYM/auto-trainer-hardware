# The Nucleo's board defconfig leaves the FPU off, and the motor motion library
# needs it. Sharing is on to avoid the Cortex-M4 context switch erratum, as on the
# pellet module board.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Keep the image inside code_partition so it cannot grow over the settings storage:
# without MCUboot the linker would otherwise be handed the whole 512K.
CONFIG_USE_DT_CODE_PARTITION=y

# No USB connector on this board, and FDCAN1 uses the PA11/PA12 pins the USB
# peripheral would need. The console is the ST-LINK virtual COM port on LPUART1.
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_CDC_ACM=n

# Settings that only apply to hardware the pellet module board carries: the external
# SPI-NOR flash that holds the MCUboot secondary slot, and the USB device port. Kept
# out of prj.conf so builds for boards without them (nucleo_g474re, which has no room
# for a second image slot) don't assign symbols whose dependencies are unmet.

CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y

CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_SPI_NOR_SFDP_RUNTIME=y

CONFIG_USB_DEVICE_STACK=y
# Use FTDI's VID and PID as we're only using the device as a serial port
CONFIG_USB_DEVICE_VID=0x0403
CONFIG_USB_DEVICE_PID=0x6001
CONFIG_USB_DEVICE_MANUFACTURER="FTDI"
CONFIG_USB_DEVICE_PRODUCT="USB-DEV"
CONFIG_USB_DEVICE_SN="0123456789ABCDEF"
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y

CONFIG_USB_CDC_ACM=y

# The dev board has 512K of internal flash and no external SPI-NOR to hold a second
# image slot; two slots big enough for this firmware do not fit. Build the
# application on its own instead, so it keeps the debug-friendly -Og build and the
# whole of flash. The JerryCAN bootloader commands are unavailable as a result.
SB_CONFIG_BOOTLOADER_NONE=y

# Only meaningful with MCUboot; cleared so sysbuild.conf's value isn't left dangling.
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE=""
